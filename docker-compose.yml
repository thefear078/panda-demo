services:
  web:
    image: ${IMAGE_NAME:-panda-web}:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: panda-web
    ports:
      - "${HOST_PORT:-80}:8080"
    restart: unless-stopped
    stop_grace_period: 10s
    # якщо процес впав — Docker підніме знову; unhealthy добиває autoheal нижче
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 20s
      timeout: 3s
      retries: 3
      start_period: 8s
    labels:
      - autoheal=true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/cache/nginx:size=16m,mode=1777
      - /var/run:size=4m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 64m
    cpus: "0.50"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # стежить за healthcheck: unhealthy → docker restart контейнера
  autoheal:
    image: willfarrell/autoheal:1.2.0
    container_name: panda-autoheal
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: "20"
      AUTOHEAL_START_PERIOD: "10"
      AUTOHEAL_DEFAULT_STOP_TIMEOUT: "10"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    security_opt:
      - no-new-privileges:true
    mem_limit: 32m
    cpus: "0.20"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
